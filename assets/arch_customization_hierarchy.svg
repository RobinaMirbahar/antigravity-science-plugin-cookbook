<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" rx="14" fill="#0B1020"/>
  <text x="30" y="38" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Google Antigravity Customization Architecture &amp; Context Economics</text>
  <text x="30" y="62" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Separating Always-On Guardrails (Rules) from On-Demand Procedural Execution (41 Science Skills + 3D MCP Sidecar)</text>

  <!-- Column 1: Discovery -->
  <rect x="28" y="84" width="285" height="328" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="44" y="112" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">1. Hierarchical Discovery</text>
  <text x="44" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Precedence (Highest to Lowest)</text>
  <rect x="44" y="148" width="253" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="172" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">1. Workspace (.agents/ walk-up)</text>
  <rect x="44" y="196" width="253" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="220" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">2. Declared (skills/plugins.json)</text>
  <rect x="44" y="244" width="253" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="268" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">3. Global (~/.gemini/config/)</text>
  <rect x="44" y="292" width="253" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="316" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">4. Built-in Bundles (/builtin/)</text>
  <rect x="44" y="340" width="253" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="364" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">5. Global Declared JSON</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="315" y1="248" x2="335" y2="248" stroke="#64748B" stroke-width="2.5"/>
  <polygon points="335,243 345,248 335,253" fill="#64748B"/>

  <!-- Column 2: Plugin Bundle -->
  <rect x="348" y="84" width="275" height="328" rx="10" fill="#111827" stroke="#A855F7" stroke-width="1.5"/>
  <text x="364" y="112" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">2. Atomic Plugin Bundle</text>
  <text x="364" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">~/.gemini/config/plugins/science/</text>
  <rect x="364" y="148" width="243" height="36" rx="6" fill="#1E293B"/>
  <text x="376" y="171" fill="#F8FAFC" font-family="Consolas, monospace" font-size="12">plugin.json (v1.3.1 Manifest)</text>
  <rect x="364" y="192" width="243" height="36" rx="6" fill="#1E293B"/>
  <text x="376" y="215" fill="#34D399" font-family="Consolas, monospace" font-size="12">rules/AGENTS.md (Always-On)</text>
  <rect x="364" y="236" width="243" height="36" rx="6" fill="#1E293B"/>
  <text x="376" y="259" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">skills/*/SKILL.md (41 Skills)</text>
  <rect x="364" y="280" width="243" height="36" rx="6" fill="#1E293B"/>
  <text x="376" y="303" fill="#FBBF24" font-family="Consolas, monospace" font-size="12">hooks.json (Pre/PostToolUse)</text>
  <rect x="364" y="324" width="243" height="36" rx="6" fill="#1E293B"/>
  <text x="376" y="347" fill="#F472B6" font-family="Consolas, monospace" font-size="12">mcp_config.json + sidecar.json</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="625" y1="248" x2="645" y2="248" stroke="#64748B" stroke-width="2.5"/>
  <polygon points="645,243 655,248 645,253" fill="#64748B"/>

  <!-- Column 3: Runtime Context Loop -->
  <rect x="658" y="84" width="274" height="328" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="674" y="112" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">3. Runtime Execution Loop</text>
  <text x="674" y="132" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Progressive Disclosure Engine</text>
  <rect x="674" y="148" width="242" height="72" rx="6" fill="#1E293B"/>
  <text x="686" y="170" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">A. Lean System Prompt</text>
  <text x="686" y="190" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">- Rules inlined (24KB/file cap)</text>
  <text x="686" y="207" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">- Only YAML name + description</text>
  <rect x="674" y="232" width="242" height="68" rx="6" fill="#1E293B"/>
  <text x="686" y="254" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">B. On-Demand Activation</text>
  <text x="686" y="274" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">read_file(SKILL.md) ONLY when</text>
  <text x="686" y="290" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">task matches skill description</text>
  <rect x="674" y="312" width="242" height="78" rx="6" fill="#1E293B"/>
  <text x="686" y="334" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">C. Deterministic Execution</text>
  <text x="686" y="354" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">- uv run scripts/*.py (PEP 723)</text>
  <text x="686" y="371" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">- 3D Mol* MCP + sidecar:// pill</text>
</svg>