<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" rx="14" fill="#0B1020"/>
  <text x="30" y="38" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Dual-Process 3D WebGL Sidecar Flow (Biomolecular Structure Viewer + MCP)</text>
  <text x="30" y="62" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">How Antigravity synchronizes PEP 723 CLI structure fetches, stdio MCP tool calls, and the PDBe Mol* v3.12.0 3D UI</text>

  <!-- Actors -->
  <rect x="30" y="84" width="140" height="36" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="68" y="107" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Researcher</text>

  <rect x="215" y="84" width="165" height="36" rx="6" fill="#1E293B" stroke="#A855F7"/>
  <text x="242" y="107" fill="#C084FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Antigravity Agent</text>

  <rect x="425" y="84" width="165" height="36" rx="6" fill="#1E293B" stroke="#FBBF24"/>
  <text x="442" y="107" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Skill: AlphaFold/PDB</text>

  <rect x="630" y="84" width="145" height="36" rx="6" fill="#1E293B" stroke="#34D399"/>
  <text x="646" y="107" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">MCP: mcp_entry</text>

  <rect x="805" y="84" width="130" height="36" rx="6" fill="#1E293B" stroke="#F472B6"/>
  <text x="818" y="107" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">3D Mol* Sidecar</text>

  <!-- Step rows -->
  <rect x="30" y="138" width="905" height="36" rx="6" fill="#111827"/>
  <text x="45" y="161" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">1. Researcher -&gt; Agent: "Visualize TP53 (UniProt P04637) and highlight the R248Q DNA-contact hotspot"</text>

  <rect x="30" y="182" width="905" height="36" rx="6" fill="#111827"/>
  <text x="45" y="205" fill="#FBBF24" font-family="Consolas, monospace" font-size="12">2. Agent -&gt; Skill: uv run scripts/fetch_structure.py P04637 -o &lt;artifact_dir&gt; (saves AF-P04637-F1-model_v6.cif)</text>

  <rect x="30" y="226" width="905" height="36" rx="6" fill="#111827"/>
  <text x="45" y="249" fill="#34D399" font-family="Consolas, monospace" font-size="12">3. Agent -&gt; MCP -&gt; Sidecar: load_structure(id="AF-P04637-F1-model_v6.cif", source="artifact")</text>

  <rect x="30" y="270" width="905" height="36" rx="6" fill="#111827"/>
  <text x="45" y="293" fill="#F472B6" font-family="Consolas, monospace" font-size="12">4. Agent -&gt; MCP -&gt; Sidecar: highlight_region(auth_asym_id="A", start_auth_seq_id=245, end_auth_seq_id=250, color="#FF1744")</text>

  <rect x="30" y="314" width="905" height="36" rx="6" fill="#111827"/>
  <text x="45" y="337" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">5. Agent -&gt; Researcher: Surfaces [Biomolecular Structure Viewer](sidecar://science/biomolecular_structure_viewer/ui.html)</text>

  <rect x="30" y="358" width="905" height="36" rx="6" fill="#111827"/>
  <text x="45" y="381" fill="#C084FC" font-family="Consolas, monospace" font-size="12">6. Bidirectional Sync: User pins 3D residue note in Mol* -&gt; Agent calls get_state() to read activeSelection &amp; annotations</text>
</svg>